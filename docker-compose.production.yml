# Production overrides — layered on top of docker-compose.yml
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.production.yml up -d
#
# Adds HTTPS on port 443 and swaps in the SSL nginx config. The certbot
# webroot bind mount is inherited from the base file, so ACME challenges
# keep working here for zero-downtime renewals.
services:
  nginx:
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro