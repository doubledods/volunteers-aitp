server {
    listen 80;
    server_name _;
    client_max_body_size 10M;

    root /var/www/laravel/public;
    index index.php;

    # Serve ACME challenges for Let's Encrypt.
    # Present in the dev config too, so the very first certificate can be
    # issued over plain HTTP before the HTTPS config (which needs a cert
    # to exist before nginx will start) is ever used.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }

    # Return 404 for all other .php files (security hardening)
    location ~ \.php$ {
        return 404;
    }

    # Deny access to hidden files (except .well-known for ACME/SSL)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}